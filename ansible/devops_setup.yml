- hosts: devops
  become: yes

  vars:
    jenkins_home: /var/jenkins_home
    kubeconfig_host: /home/ubuntu/.kube
    jenkins_image_dir: /home/ubuntu/jenkins-docker

  tasks:

  # -------------------------------------------------
  # 1. Base system
  # -------------------------------------------------

  - name: Install required packages
    apt:
      name:
        - curl
        - ca-certificates
        - gnupg
        - git
        - unzip
        - lsb-release
        - docker.io
      update_cache: yes
      state: present

  - name: Enable Docker
    service:
      name: docker
      state: started
      enabled: yes

  - name: Add ubuntu to docker group
    user:
      name: ubuntu
      groups: docker
      append: yes

  # -------------------------------------------------
  # 2. Install k3s Kubernetes
  # -------------------------------------------------

  - name: Download k3s installer
    get_url:
      url: https://get.k3s.io
      dest: /tmp/k3s_install.sh
      mode: '0755'

  - name: Install k3s single node
    shell: /tmp/k3s_install.sh --write-kubeconfig-mode 644
    args:
      creates: /usr/local/bin/kubectl

  - name: Wait for k3s API to be ready
    shell: kubectl get nodes
    register: k3s_ready
    retries: 10
    delay: 10
    until: k3s_ready.rc == 0

  # -------------------------------------------------
  # 3. Prepare kubeconfig for Jenkins
  # -------------------------------------------------

  - name: Ensure kube directory exists
    file:
      path: "{{ kubeconfig_host }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Copy kubeconfig
    copy:
      src: /etc/rancher/k3s/k3s.yaml
      dest: "{{ kubeconfig_host }}/config"
      remote_src: yes
      owner: ubuntu
      group: ubuntu
      mode: '0644'

  # Get EC2 private IP dynamically
  - name: Get host private IP
    shell: hostname -I | awk '{print $1}'
    register: private_ip

  # Replace localhost with real host IP (PERMANENT FIX)
  - name: Update kubeconfig server address
    replace:
      path: "{{ kubeconfig_host }}/config"
      regexp: 'https://127.0.0.1:6443'
      replace: "https://{{ private_ip.stdout }}:6443"

  # -------------------------------------------------
  # 4. Build Jenkins image with Docker + kubectl
  # -------------------------------------------------

  - name: Create Jenkins build directory
    file:
      path: "{{ jenkins_image_dir }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Create Jenkins Dockerfile
    copy:
      dest: "{{ jenkins_image_dir }}/Dockerfile"
      content: |
        FROM jenkins/jenkins:lts
        USER root

        RUN apt-get update && apt-get install -y \
            ca-certificates curl gnupg lsb-release \
         && mkdir -m 0755 -p /etc/apt/keyrings \
         && curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg \
         && echo \
           "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian \
           $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
           > /etc/apt/sources.list.d/docker.list \
         && apt-get update \
         && apt-get install -y docker-ce-cli \
         && curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
         && install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl \
         && rm kubectl

        USER jenkins

  - name: Build Jenkins Docker image
    community.docker.docker_image:
      name: jenkins-docker
      build:
        path: "{{ jenkins_image_dir }}"
      source: build

  # -------------------------------------------------
  # 5. Run Jenkins container
  # -------------------------------------------------

  - name: Create Jenkins home
    file:
      path: "{{ jenkins_home }}"
      state: directory
      owner: 1000
      group: 1000
      mode: '0755'

  - name: Run Jenkins container
    community.docker.docker_container:
      name: jenkins
      image: jenkins-docker
      state: started
      recreate: yes
      restart_policy: always
      user: root
      privileged: yes
      ports:
        - "8080:8080"
        - "50000:50000"
      volumes:
        - "{{ jenkins_home }}:/var/jenkins_home"
        - "/var/run/docker.sock:/var/run/docker.sock"
        - "{{ kubeconfig_host }}:/var/jenkins_home/.kube"

  # -------------------------------------------------
  # 6. Validate Kubernetes from Jenkins
  # -------------------------------------------------

  - name: Test kubectl inside Jenkins
    command: docker exec jenkins kubectl get nodes
    register: test_k8s
    retries: 5
    delay: 10
    until: test_k8s.rc == 0

  - debug:
      var: test_k8s.stdout