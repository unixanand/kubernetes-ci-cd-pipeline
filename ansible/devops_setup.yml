- hosts: devops
  become: yes

  tasks:

    # -----------------------------
    # System preparation
    # -----------------------------

    - name: Ensure jenkins user exists
      user:
        name: jenkins
        shell: /bin/bash
        create_home: yes

    - name: Create project directory
      file:
        path: /opt/devops-project
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Install required base packages
      apt:
        name:
          - openjdk-17-jdk
          - curl
          - gnupg
          - ca-certificates
          - apt-transport-https
          - docker.io
          - git
          - unzip
        state: present
        update_cache: yes

    # -----------------------------
    # Docker setup
    # -----------------------------

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add jenkins to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    # -----------------------------
    # Jenkins installation (stable + keyserver)
    # -----------------------------

    - name: Remove old Jenkins repo if exists
      file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Import Jenkins key from Ubuntu keyserver
      shell: |
        apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 7198F4B714ABFC68
      args:
        warn: false

    - name: Add Jenkins repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb https://pkg.jenkins.io/debian-stable binary/

    - name: Update apt cache after Jenkins repo
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    # -----------------------------
    # Kubernetes tools
    # -----------------------------

    - name: Install kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install kops
      get_url:
        url: https://github.com/kubernetes/kops/releases/download/v1.28.0/kops-linux-amd64
        dest: /usr/local/bin/kops
        mode: '0755'
