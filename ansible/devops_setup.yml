- hosts: devops
  become: yes

  tasks:

    - name: Ensure jenkins user exists
      user:
        name: jenkins
        shell: /bin/bash
        create_home: yes

    - name: Create project directory
      file:
        path: /opt/devops-project
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    # ---------- FIX REPO ----------

    - name: Install base packages (no update yet)
      apt:
        name:
          - curl
          - gnupg
          - ca-certificates
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins key
      get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2023.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc

    - name: Convert Jenkins key
      shell: |
        gpg --dearmor -o /etc/apt/keyrings/jenkins-keyring.gpg \
        /etc/apt/keyrings/jenkins-keyring.asc
      args:
        creates: /etc/apt/keyrings/jenkins-keyring.gpg

    - name: Add Jenkins repo
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/etc/apt/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian binary/

    - name: Update apt cache safely
      apt:
        update_cache: yes

    # ---------- NOW INSTALL SOFTWARE ----------

    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - docker.io
          - git
          - unzip
          - jenkins
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Start Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins
      service:
        name: jenkins
        state: restarted

    - name: Install kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install kops
      get_url:
        url: https://github.com/kubernetes/kops/releases/download/v1.28.0/kops-linux-amd64
        dest: /usr/local/bin/kops
        mode: '0755'
