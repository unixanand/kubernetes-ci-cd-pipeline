- hosts: devops
  become: yes

  tasks:
    - name: Create project directory
      file:
        path: /opt/devops-project
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - docker.io
          - git
          - unzip
        update_cache: yes

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add Jenkins repo key
      shell: |
        curl -fsSL https://pkg.jenkins.io/debian/jenkins.io.key | tee \
        /usr/share/keyrings/jenkins-keyring.asc

    - name: Add Jenkins repo
      shell: |
        echo deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] \
        https://pkg.jenkins.io/debian binary/ > \
        /etc/apt/sources.list.d/jenkins.list

    - name: Install Jenkins
      apt:
        name: jenkins
        update_cache: yes

    - name: Start Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Add Jenkins user to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins
      service:
        name: jenkins
        state: restarted

    - name: Install kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install kops
      get_url:
        url: https://github.com/kubernetes/kops/releases/download/v1.28.0/kops-linux-amd64
        dest: /usr/local/bin/kops
        mode: '0755'

