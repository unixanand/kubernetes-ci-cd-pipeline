- hosts: devops
  become: yes

  vars:
    jenkins_home: /var/jenkins_home
    kubeconfig_host: /home/ubuntu/.kube
    jenkins_image_dir: /home/ubuntu/jenkins-docker

  tasks:

  # -------------------------------------------------
  # 1. System preparation
  # -------------------------------------------------

  - name: Ensure jenkins user exists
    user:
      name: jenkins
      shell: /bin/bash
      create_home: yes

  - name: Create project directory
    file:
      path: /opt/devops-project
      state: directory
      owner: jenkins
      group: jenkins
      mode: '0755'

  - name: Install base packages
    apt:
      name:
        - curl
        - ca-certificates
        - gnupg
        - git
        - unzip
        - lsb-release
      state: present
      update_cache: yes

  # -------------------------------------------------
  # 2. Docker setup on host
  # -------------------------------------------------

  - name: Install Docker on host
    apt:
      name: docker.io
      state: present
      update_cache: yes

  - name: Start and enable Docker service
    service:
      name: docker
      state: started
      enabled: yes

  - name: Add ubuntu to docker group
    user:
      name: ubuntu
      groups: docker
      append: yes

  # -------------------------------------------------
  # 3. Install k3s Kubernetes FIRST
  # -------------------------------------------------

  - name: Ensure kubeconfig directory exists
    file:
      path: "{{ kubeconfig_host }}"
      state: directory
      owner: 1000
      group: 1000
      mode: '0755'

  - name: Download k3s install script
    get_url:
      url: https://get.k3s.io
      dest: /tmp/k3s_install.sh
      mode: '0755'

  - name: Install k3s single-node
    shell: /tmp/k3s_install.sh --write-kubeconfig-mode 644
    args:
      creates: /usr/local/bin/kubectl

  - name: Copy kubeconfig for Jenkins
    copy:
      src: /etc/rancher/k3s/k3s.yaml
      dest: "{{ kubeconfig_host }}/config"
      remote_src: yes
      owner: 1000
      group: 1000
      mode: '0644'

  # -------------------------------------------------
  # 4. Build custom Jenkins image (Docker + kubectl)
  # -------------------------------------------------

  - name: Ensure Jenkins Docker build directory exists
    file:
      path: "{{ jenkins_image_dir }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Create Dockerfile for Jenkins
    copy:
      dest: "{{ jenkins_image_dir }}/Dockerfile"
      content: |
        FROM jenkins/jenkins:lts

        USER root

        # Install Docker CLI
        RUN apt-get update \
         && apt-get install -y \
              ca-certificates \
              curl \
              gnupg \
              lsb-release \
         && mkdir -m 0755 -p /etc/apt/keyrings \
         && curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg \
         && echo \
           "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian \
           $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
           > /etc/apt/sources.list.d/docker.list \
         && apt-get update \
         && apt-get install -y docker-ce-cli \
         && apt-get clean

        # Install kubectl
        RUN curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
         && install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl \
         && rm kubectl

        USER jenkins

  - name: Build custom Jenkins Docker image
    community.docker.docker_image:
      name: jenkins-docker
      build:
        path: "{{ jenkins_image_dir }}"
      source: build

  # -------------------------------------------------
  # 5. Run Jenkins container
  # -------------------------------------------------

  - name: Create Jenkins home directory
    file:
      path: "{{ jenkins_home }}"
      state: directory
      owner: 1000
      group: 1000
      mode: '0755'

  - name: Run Jenkins container
    community.docker.docker_container:
      name: jenkins
      image: jenkins-docker
      state: started
      recreate: yes
      restart_policy: always
      user: root
      privileged: yes
      ports:
        - "8080:8080"
        - "50000:50000"
      env:
        KUBECONFIG: /var/jenkins_home/.kube/config
      volumes:
        - "{{ jenkins_home }}:/var/jenkins_home"
        - "/var/run/docker.sock:/var/run/docker.sock"
        - "{{ kubeconfig_host }}:/var/jenkins_home/.kube"

  # -------------------------------------------------
  # 6. Verify installation
  # -------------------------------------------------

  - name: Test kubectl inside Jenkins
    command: docker exec jenkins kubectl get nodes
    register: k8s_nodes
    changed_when: false

  - debug:
      var: k8s_nodes.stdout