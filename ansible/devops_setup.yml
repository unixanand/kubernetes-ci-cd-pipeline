- hosts: devops
  become: yes

  tasks:

    # ---------------- USER + PROJECT ----------------

    - name: Ensure jenkins user exists
      user:
        name: jenkins
        shell: /bin/bash
        create_home: yes

    - name: Create project directory
      file:
        path: /opt/devops-project
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    # ---------------- FIX JENKINS APT TRUST ----------------

    - name: Remove any old Jenkins repo
      file:
        path: /etc/apt/sources.list.d/jenkins.list
        state: absent

    - name: Remove old Jenkins keys
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/keyrings/jenkins-keyring.gpg
        - /etc/apt/keyrings/jenkins-keyring.gpg
        - /etc/apt/keyrings/jenkins-keyring.asc

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Install base packages
      apt:
        name:
          - curl
          - gnupg
          - ca-certificates
        state: present
        update_cache: yes

    - name: Download Jenkins signing key
      get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2023.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Convert Jenkins key to gpg
      shell: |
        gpg --dearmor \
        -o /etc/apt/keyrings/jenkins-keyring.gpg \
        /etc/apt/keyrings/jenkins-keyring.asc
      args:
        creates: /etc/apt/keyrings/jenkins-keyring.gpg

    - name: Set key permission for apt
      file:
        path: /etc/apt/keyrings/jenkins-keyring.gpg
        mode: '0644'

    - name: Add Jenkins repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/etc/apt/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian binary/

    - name: Update apt cache
      apt:
        update_cache: yes

    # ---------------- INSTALL SOFTWARE ----------------

    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - docker.io
          - git
          - unzip
          - jenkins
        state: present

    # ---------------- SERVICES ----------------

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Start Jenkins
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Add Jenkins to Docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Restart Jenkins
      service:
        name: jenkins
        state: restarted

    # ---------------- CLI TOOLS ----------------

    - name: Install kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install kops
      get_url:
        url: https://github.com/kubernetes/kops/releases/download/v1.28.0/kops-linux-amd64
        dest: /usr/local/bin/kops
        mode: '0755'
