- hosts: devops
  become: yes

  vars:
    jenkins_home: /var/jenkins_home
    kubeconfig_host: /home/ubuntu/.kube
    jenkins_image_dir: /home/ubuntu/jenkins-docker

  tasks:

  # -------------------------------------------------
  # System preparation
  # -------------------------------------------------

  - name: Ensure jenkins user exists
    user:
      name: jenkins
      shell: /bin/bash
      create_home: yes

  - name: Create project directory
    file:
      path: /opt/devops-project
      state: directory
      owner: jenkins
      group: jenkins
      mode: '0755'

  - name: Install base packages
    apt:
      name:
        - curl
        - ca-certificates
        - gnupg
        - docker.io
        - git
        - unzip
      state: present
      update_cache: yes

  # -------------------------------------------------
  # Docker setup
  # -------------------------------------------------

  - name: Start and enable Docker
    service:
      name: docker
      state: started
      enabled: yes

  - name: Add ubuntu user to docker group
    user:
      name: ubuntu
      groups: docker
      append: yes

  - name: Add jenkins user to docker group
    user:
      name: jenkins
      groups: docker
      append: yes


  # -------------------------------------------------
  # Build custom Jenkins image with Docker CLI
  # -------------------------------------------------

  - name: Create directory for Jenkins Docker build
    file:
      path: "{{ jenkins_image_dir }}"
      state: directory

  - name: Create Dockerfile for Jenkins with Docker CLI
    copy:
      dest: "{{ jenkins_image_dir }}/Dockerfile"
      content: |
        FROM jenkins/jenkins:lts
        USER root
        RUN apt-get update && apt-get install -y docker.io
        USER jenkins

  - name: Build custom Jenkins image
    community.docker.docker_image:
      name: jenkins-docker
      build:
        path: "{{ jenkins_image_dir }}"
      source: build


  # -------------------------------------------------
  # Jenkins container
  # -------------------------------------------------

  - name: Create Jenkins home directory
    file:
      path: "{{ jenkins_home }}"
      state: directory
      owner: 1000
      group: 1000
      mode: '0755'

  - name: Run Jenkins container
    community.docker.docker_container:
      name: jenkins
      image: jenkins-docker
      state: started
      recreate: yes
      restart_policy: always
      ports:
        - "8080:8080"
        - "50000:50000"
      volumes:
        - "{{ jenkins_home }}:/var/jenkins_home"
        - "/var/run/docker.sock:/var/run/docker.sock"
        - "{{ kubeconfig_host }}:/var/jenkins_home/.kube"
