- hosts: devops
  become: yes

  vars:
    jenkins_home: /var/jenkins_home
    kubeconfig_host: /home/ubuntu/.kube
    jenkins_image_dir: /home/ubuntu/jenkins-docker

  tasks:

  # -------------------------------------------------
  # System preparation
  # -------------------------------------------------

  - name: Ensure jenkins user exists
    user:
      name: jenkins
      shell: /bin/bash
      create_home: yes

  - name: Create project directory
    file:
      path: /opt/devops-project
      state: directory
      owner: jenkins
      group: jenkins
      mode: '0755'

  - name: Install base packages
    apt:
      name:
        - curl
        - ca-certificates
        - gnupg
        - git
        - unzip
        - lsb-release
      state: present
      update_cache: yes

  # -------------------------------------------------
  # Docker setup on host
  # -------------------------------------------------

  - name: Install Docker on host
    apt:
      name:
        - docker.io
      state: present
      update_cache: yes

  - name: Start and enable Docker service
    service:
      name: docker
      state: started
      enabled: yes

  # -------------------------------------------------
  # Build custom Jenkins image with Docker CLI
  # -------------------------------------------------

  - name: Ensure Jenkins Docker build directory exists
    file:
      path: "{{ jenkins_image_dir }}"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: '0755'

  - name: Create Dockerfile for Jenkins with Docker CLI
    copy:
      dest: "{{ jenkins_image_dir }}/Dockerfile"
      content: |
        FROM jenkins/jenkins:lts

        USER root

        # Install official Docker CLI inside Jenkins container
        RUN apt-get update \
         && apt-get install -y \
              ca-certificates \
              curl \
              gnupg \
              lsb-release \
         && mkdir -m 0755 -p /etc/apt/keyrings \
         && curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg \
         && echo \
           "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian \
           $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
           > /etc/apt/sources.list.d/docker.list \
         && apt-get update \
         && apt-get install -y docker-ce-cli \
         && apt-get clean

        USER jenkins

  - name: Build custom Jenkins Docker image
    community.docker.docker_image:
      name: jenkins-docker
      build:
        path: "{{ jenkins_image_dir }}"
      source: build

  # -------------------------------------------------
  # Run Jenkins container as root (privileged for Docker)
  # -------------------------------------------------

  - name: Create Jenkins home directory
    file:
      path: "{{ jenkins_home }}"
      state: directory
      owner: 1000
      group: 1000
      mode: '0755'

  - name: Run Jenkins container (root + privileged)
    community.docker.docker_container:
      name: jenkins
      image: jenkins-docker
      state: started
      recreate: yes
      restart_policy: always
      user: root
      privileged: yes
      ports:
        - "8080:8080"
        - "50000:50000"
      volumes:
        - "{{ jenkins_home }}:/var/jenkins_home"
        - "/var/run/docker.sock:/var/run/docker.sock"
        - "{{ kubeconfig_host }}:/var/jenkins_home/.kube"
