apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamlit-ingress
  annotations:
    kubernetes.io/ingress.class: alb                  # or alb if using older controller versions
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance   # for EC2 workers (or 'ip' if using VPC CNI properly)
    alb.ingress.kubernetes.io/healthcheck-path: /_stcore/health   # Streamlit's built-in health endpoint
    alb.ingress.kubernetes.io/healthcheck-port: "8501"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'      # Start with HTTP; add HTTPS later
    # Optional: alb.ingress.kubernetes.io/ssl-redirect: '443'     # if you add cert later
spec:
  rules:
  - http:                                           # No 'host:' field needed
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: streamlit-service                 # your Service name
            port:
              number: 8501